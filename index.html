<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>shekerFND // LINK STATION</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-0: #0a0908;
    --kuka-orange: #ff6a00;
    --kuka-orange-deep: #c44300;
    --kuka-yellow: #ffb800;
    --text: #e8e3dc;
    --text-dim: #888278;
    --grid: rgba(255, 106, 0, 0.05);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg-0);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    cursor: crosshair;
  }

  /* On mouse/trackpad devices the canvas draws the reticle itself,
     so the native cursor is hidden to avoid a double crosshair.
     Touch devices have no cursor; the rule is a no-op there.
     If the canvas loop ever dies (see window 'error' handler in the
     script) the html.no-canvas class restores the native cursor. */
  @media (pointer: fine) and (hover: hover) {
    html:not(.no-canvas), html:not(.no-canvas) body, html:not(.no-canvas) .link {
      cursor: none;
    }
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 1;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Container in middle layer */
  .container {
    position: relative;
    z-index: 4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    pointer-events: none;
  }

  /* Canvas on top, but pointer-events: none so links remain clickable */
  #robotCanvas {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    z-index: 20;
    pointer-events: none;
  }

  .hud {
    position: fixed; z-index: 30;
    font-size: 10px; letter-spacing: 0.2em;
    color: var(--kuka-orange);
    line-height: 1.8;
    pointer-events: none;
  }
  .hud .label { color: var(--text-dim); }
  .hud .val { color: var(--kuka-yellow); }
  .hud-tl { top: 24px; left: 24px; }
  .hud-tr { top: 24px; right: 24px; text-align: right; }
  .hud-bl { bottom: 24px; left: 24px; font-size: 9px; color: var(--text-dim); letter-spacing: 0.3em; }
  .hud-br { bottom: 24px; right: 24px; font-size: 9px; color: var(--text-dim); letter-spacing: 0.3em; text-align: right; }

  .dot {
    display: inline-block;
    width: 7px; height: 7px;
    background: #00ff66; border-radius: 50%;
    margin-right: 6px;
    box-shadow: 0 0 8px #00ff66;
    animation: pulse 1.5s infinite;
    vertical-align: middle;
  }
  /* Render loop asleep (no input, nothing animating) */
  .dot.standby {
    background: var(--kuka-yellow);
    box-shadow: 0 0 8px var(--kuka-yellow);
    animation: none;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    pointer-events: auto;
  }

  .id-tag {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.4em;
    color: var(--kuka-orange);
    padding: 4px 12px;
    border: 1px solid var(--kuka-orange);
    margin-bottom: 14px;
    background: rgba(255, 106, 0, 0.08);
  }

  .title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(32px, 5vw, 52px);
    letter-spacing: 0.05em;
    color: var(--text);
    text-shadow: 0 0 20px rgba(255, 106, 0, 0.3);
    line-height: 1;
    margin-bottom: 8px;
  }
  .title span { color: var(--kuka-orange); }

  .subtitle {
    font-size: 11px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .panel {
    width: min(420px, 90vw);
    background: rgba(20, 17, 15, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 106, 0, 0.25);
    border-radius: 2px;
    padding: 20px;
    pointer-events: auto;
    position: relative;
  }

  .panel::before, .panel::after {
    content: '';
    position: absolute;
    width: 14px; height: 14px;
    border: 2px solid var(--kuka-orange);
  }
  .panel::before {
    top: -2px; left: -2px;
    border-right: none; border-bottom: none;
  }
  .panel::after {
    bottom: -2px; right: -2px;
    border-left: none; border-top: none;
  }

  .panel-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 9px;
    letter-spacing: 0.25em;
    color: var(--text-dim);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px dashed rgba(255, 106, 0, 0.2);
  }
  .panel-header .right { color: var(--kuka-yellow); }

  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    background: rgba(42, 40, 38, 0.55);
    border: 1px solid rgba(138, 133, 128, 0.15);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.05em;
    font-weight: 500;
    transition: all 0.2s ease;
    position: relative;
  }
  .node-list { list-style: none; margin: 0; padding: 0; }
  .node-list li + li { margin-top: 8px; }

  .link::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--kuka-orange);
    transform: scaleY(0);
    transition: transform 0.2s ease;
  }

  .link:hover {
    background: rgba(255, 106, 0, 0.1);
    border-color: var(--kuka-orange);
    transform: translateX(4px);
  }
  .link:hover::before { transform: scaleY(1); }
  .link:active { transform: translateX(4px) scale(0.98); }

  /* Keyboard navigation: Tab moves between nodes; the focused node
     gets the same treatment as hover plus a visible outline. */
  .link:focus-visible {
    outline: 2px solid var(--kuka-yellow);
    outline-offset: 2px;
    background: rgba(255, 106, 0, 0.1);
    border-color: var(--kuka-orange);
  }
  .link:focus-visible::before { transform: scaleY(1); }

  /* Reduced motion: no pulsing LED, no hover slides. The arm itself
     is handled in the script (parks and stops tracking the pointer). */
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .link, .link::before, .link-arrow { transition: none; }
    .link:hover, .link:active { transform: none; }
  }

  .link-icon {
    width: 22px; height: 22px;
    flex-shrink: 0;
    fill: currentColor;
    color: var(--kuka-orange);
  }

  .link-text {
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .link-name { font-size: 13px; color: var(--text); }
  .link-handle {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    margin-top: 2px;
  }

  .link-arrow {
    font-size: 14px;
    color: var(--text-dim);
    transition: all 0.2s ease;
  }

  /* OFFLINE node: a link whose url is empty in links.js. Rendered as
     a non-interactive row with a red status LED so the slot is
     visibly reserved rather than a dead href="#". */
  .link--offline {
    opacity: 0.55;
    pointer-events: none;
    border-style: dashed;
  }
  .link--offline .link-icon,
  .link--offline .link-name { color: var(--text-dim); }
  .link--offline .link-handle {
    color: #ff3a00;
    letter-spacing: 0.2em;
  }
  .link--offline .link-handle::before {
    content: '';
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #ff3a00;
    box-shadow: 0 0 6px #ff3a00;
    margin-right: 6px;
    vertical-align: middle;
  }
  .link:hover .link-arrow {
    color: var(--kuka-orange);
    transform: translateX(2px);
  }

  .stripe {
    height: 8px;
    background: repeating-linear-gradient(
      45deg,
      var(--kuka-yellow) 0,
      var(--kuka-yellow) 10px,
      #1a1612 10px,
      #1a1612 20px
    );
    margin-top: 16px;
    opacity: 0.6;
  }

  /* ============================================================
     MOBILE LAYOUT (<=768px)
     ------------------------------------------------------------
     Strategy:
     - Corner HUD blocks removed (they overlap on narrow screens
       because they're fixed to opposite corners with static px
       fonts; on a ~390px viewport left+right collide).
     - Robot arm stays IN FRONT (same as desktop), tracking the
       touch point. Only the HUD is simplified.
     ============================================================ */
  @media (max-width: 768px) {
    /* The page is allowed to scroll on phones. With overflow:hidden
       the bottom links were unreachable on short viewports
       (<= ~570px, e.g. iPhone SE). 100dvh tracks the *dynamic*
       viewport, so the collapsing URL bar no longer changes the
       layout height. The canvas is position:fixed and unaffected. */
    html, body {
      height: auto;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Hide all corner telemetry - only the OPERATOR tag in the
       header remains (it lives inside flow, never overlaps) */
    .hud-tl, .hud-tr, .hud-bl, .hud-br {
      display: none;
    }

    /* Panel tightened for small viewports */
    .panel {
      padding: 16px;
    }

    .container {
      padding: 16px;
      justify-content: flex-start;
      padding-top: 6vh;
      padding-bottom: 32px;
      height: auto;
      min-height: 100dvh;
    }

    .title {
      font-size: clamp(28px, 9vw, 42px);
    }

    .subtitle {
      font-size: 10px;
      letter-spacing: 0.2em;
    }

    .header {
      margin-bottom: 20px;
    }

    .link { padding: 11px 12px; }
    .link-name { font-size: 12px; }
    .link-handle { font-size: 9px; }
  }

  /* Very small phones */
  @media (max-width: 380px) {
    .title { font-size: clamp(24px, 8vw, 34px); }
    .panel { padding: 13px; }
  }
</style>
</head>
<body>

<canvas id="robotCanvas" aria-hidden="true"></canvas>

<div class="hud hud-tl" aria-hidden="true">
  <div><span class="label">SYS:</span> <span class="val">KR-4DOF</span></div>
  <div><span class="label">MODE:</span> STAMP-IK</div>
  <div><span class="label">EE:</span> <span id="eePos">000, 000</span></div>
</div>

<div class="hud hud-tr" aria-hidden="true">
  <div><span class="dot" id="sysDot"></span><span class="val" id="sysState">ONLINE</span></div>
  <div><span class="label">HEAD:</span> <span id="gripState" class="val">IDLE</span></div>
  <div><span class="label">STAMPS:</span> <span id="stampCount" class="val">000</span></div>
</div>

<div class="hud hud-bl" aria-hidden="true">// LINK_STATION_v2.6 // EST.2026</div>
<div class="hud hud-br" aria-hidden="true">SHEKERFND // ASABEES</div>

<div class="container">
  <div class="header">
    <div class="id-tag">// OPERATOR: SHEKERFND</div>
    <h1 class="title">LINK<span>::</span>STATION</h1>
    <div class="subtitle">— CLICK to mark · select node to connect —</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <span>[ AVAILABLE_NODES ]</span>
      <span class="right" id="nodeCount">-- ACTIVE</span>
    </div>

    <nav aria-label="Nodes">
      <ul class="node-list" id="nodeList">
        <!-- filled from links.js by renderNodes() -->
      </ul>
    </nav>

    <div class="stripe"></div>
  </div>
</div>

<script src="icons.js"></script>
<script src="links.js"></script>
<script>
/* ============================================================
   NODE PANEL - built from links.js
   ------------------------------------------------------------
   Nodes with a url become <a> elements (external links open in a
   new tab, mailto: stays in-tab). Nodes with an empty url become
   non-interactive OFFLINE rows. The header count is derived from
   the data so it can't drift from the list.
   ============================================================ */
function renderNodes() {
  const list = document.getElementById('nodeList');
  const countEl = document.getElementById('nodeCount');
  const nodes = window.STATION_NODES || [];
  const icons = window.STATION_ICONS || {};
  const pad2 = n => String(n).padStart(2, '0');
  let active = 0, offline = 0;

  list.textContent = '';
  for (const node of nodes) {
    const isOffline = !node.url;
    const li = document.createElement('li');
    const el = document.createElement(isOffline ? 'div' : 'a');
    el.className = 'link' + (isOffline ? ' link--offline' : '');
    if (isOffline) {
      el.setAttribute('aria-disabled', 'true');
      offline++;
    } else {
      el.href = node.url;
      if (!node.url.startsWith('mailto:')) {
        el.target = '_blank';
        el.rel = 'noopener';
      }
      active++;
    }

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'link-icon');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', icons[node.icon] || '');
    svg.appendChild(path);

    const text = document.createElement('div');
    text.className = 'link-text';
    const name = document.createElement('span');
    name.className = 'link-name';
    name.textContent = node.name;
    const handle = document.createElement('span');
    handle.className = 'link-handle';
    handle.textContent = isOffline ? 'OFFLINE' : node.handle;
    text.append(name, handle);

    const arrow = document.createElement('span');
    arrow.className = 'link-arrow';
    arrow.textContent = isOffline ? '\u00d7' : '\u2192';

    el.append(svg, text, arrow);
    li.appendChild(el);
    list.appendChild(li);
  }

  countEl.textContent = `${pad2(active)} ACTIVE` + (offline ? ` \u00b7 ${pad2(offline)} OFFLINE` : '');
}
renderNodes();

/* ============================================================
   4-DOF ARM + PNEUMATIC STAMPING HEAD
   ------------------------------------------------------------
   Layer architecture:
     z=1   grid background
     z=2   vignette
     z=4   content (panel + header), pointer-events:auto on
           interactive children only
     z=20  canvas (robot arm + stamps), pointer-events: none
           so clicks pass through to the panel beneath
   
   Stamping state machine (per click):
     idle -> pressing (140ms, piston extends, ease-in)
          -> printing (60ms, full pressure, drop stamp)
          -> retracting (260ms, piston returns, ease-out)
          -> idle
   
   Stamp pool: ring buffer, max 30 active. Each stamp fades
   over ~3.5s with cubic ease-out, then is recycled.
   ============================================================ */

// Safety net for the hidden native cursor (see CSS): any uncaught
// error in this script restores it so the page stays usable.
window.addEventListener('error', () => document.documentElement.classList.add('no-canvas'));

const canvas = document.getElementById('robotCanvas');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;

let W = 0, H = 0;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();

const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };

// prefers-reduced-motion: the arm parks beside the panel instead of
// sweeping after the pointer, and clicks stamp instantly (no piston
// animation). Fades and the reticle are left as-is; they don't move.
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
function getParkTarget() {
  const base = getBase();
  return { x: base.x + W * 0.14, y: H * 0.48 };
}

// Debounced resize: mobile browsers fire resize constantly as
// the URL bar shows/hides. Debounce avoids thrashing the
// kinematics. orientationchange is explicit for older browsers
// that don't reliably fire resize on rotation.
let resizeTimer = null;
function handleResize() {
  clearTimeout(resizeTimer);
  // Setting canvas.width clears the bitmap, so a sleeping loop must be
  // woken to repaint after the resize.
  resizeTimer = setTimeout(() => { resize(); computeLengths(); wake(); }, 120);
}
window.addEventListener('resize', handleResize);
window.addEventListener('orientationchange', handleResize);

/* ------------------------------------------------------------
   Render scheduling
   The loop only runs while something on screen can change: the
   pointer moved recently, a press cycle is running, stamps are
   still fading, or the arm hasn't settled on its target. Otherwise
   it stops (no rAF, no canvas work at all) and the HUD shows
   STANDBY. Any input wakes it. On phones this is the difference
   between a warm pocket and an idle tab.
   ------------------------------------------------------------ */
const SETTLE_MS = 1200;      // keep drawing this long after the last input
let lastInput = performance.now();
let loopActive = false;
let armSettled = false;      // set by solveIK each frame

function wake() {
  if (loopActive) return;
  loopActive = true;
  requestAnimationFrame(render);
}
function noteInput() {
  lastInput = performance.now();
  wake();
}

window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; noteInput(); });
window.addEventListener('mousedown', e => { noteInput(); triggerStamp(e.clientX, e.clientY); });
window.addEventListener('touchmove', e => {
  if (e.touches[0]) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; noteInput(); }
}, { passive: true });
window.addEventListener('touchstart', e => {
  if (e.touches[0]) {
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    noteInput();
    triggerStamp(mouse.x, mouse.y);
  }
}, { passive: true });

// Mobile detection - matches the CSS breakpoint so JS layout
// math stays in sync with the visual layout
function isMobile() {
  return W <= 768;
}

function getBase() {
  if (isMobile()) {
    // On mobile the arm is a dim background element. Anchor it
    // lower-left but pull slightly off-screen so the elbow sweep
    // sits behind the panel instead of across the title.
    return { x: W * 0.10, y: H - 30 };
  }
  return { x: W * 0.16, y: H - 50 };
}

let armLengths = [];
function computeLengths() {
  let total;
  if (isMobile()) {
    // Width-based, not diagonal-based: tall narrow phones have a
    // huge diagonal relative to width, which previously made the
    // arm overshoot across the whole screen. Scale to width and
    // cap so the arm stays compact behind the content.
    total = Math.min(W * 1.15, H * 0.55);
  } else {
    const diag = Math.hypot(W, H);
    total = diag * 0.55;
  }
  armLengths = [
    total * 0.34,
    total * 0.28,
    total * 0.18,
    total * 0.10
  ];
}
computeLengths();

const angles = [-Math.PI / 2, -Math.PI / 3, -Math.PI / 6, 0];

/* ============================================================
   STAMPING STATE MACHINE
   ============================================================ */
const PHASE_IDLE = 0;
const PHASE_PRESS = 1;
const PHASE_PRINT = 2;
const PHASE_RETRACT = 3;

const stampHead = {
  phase: PHASE_IDLE,
  phaseStart: 0,
  pistonExtension: 0,  // 0 = retracted, 1 = fully extended
  pressureRing: 0,     // shockwave ring opacity 0-1
  pendingStamp: null,  // {x, y, reachable} - target location for next stamp
  wasOutOfReach: false // tracks last click reachability for HUD/crosshair feedback
};

/* ----------------------------------------------------------
   Reachability test - is target inside annular workspace?
   - Outer bound: sum of all link lengths
   - Inner bound: longest link - sum of others (can't fold tighter)
   Returns { reachable, distance, maxReach, minReach }
   ---------------------------------------------------------- */
function checkReach(targetX, targetY) {
  const base = getBase();
  const dx = targetX - base.x;
  const dy = targetY - base.y;
  const distance = Math.hypot(dx, dy);

  const maxReach = armLengths.reduce((a, b) => a + b, 0);
  const longest = Math.max(...armLengths);
  const rest = maxReach - longest;
  const minReach = Math.max(0, longest - rest);

  // Tolerance: leave 2px breathing room so stamps right at the
  // edge don't oscillate between reachable/unreachable
  const reachable = distance <= maxReach - 2 && distance >= minReach;
  return { reachable, distance, maxReach, minReach };
}

const PHASE_DURATIONS = {
  [PHASE_PRESS]: 140,
  [PHASE_PRINT]: 60,
  [PHASE_RETRACT]: 260
};

function triggerStamp(x, y) {
  if (reduceMotion.matches) {
    // No press cycle: the mark simply appears where the user clicked.
    commitStamp(x, y, false);
    return;
  }
  // Queue the stamp; only re-trigger if currently idle
  // (prevents broken animation from rapid clicks)
  if (stampHead.phase === PHASE_IDLE) {
    const reach = checkReach(x, y);
    stampHead.phase = PHASE_PRESS;
    stampHead.phaseStart = performance.now();
    // Store both target intent and reachability flag.
    // If unreachable, actual stamp coords will be resolved
    // at commit time from current EE position.
    stampHead.pendingStamp = { x, y, reachable: reach.reachable };
    stampHead.wasOutOfReach = !reach.reachable;
  }
}

function updateStampHead(now) {
  if (stampHead.phase === PHASE_IDLE) {
    stampHead.pistonExtension *= 0.85; // settle to 0
    stampHead.pressureRing *= 0.9;
    return;
  }

  const elapsed = now - stampHead.phaseStart;
  const dur = PHASE_DURATIONS[stampHead.phase];
  const t = Math.min(elapsed / dur, 1);

  if (stampHead.phase === PHASE_PRESS) {
    // Ease-in cubic - piston accelerates downward
    stampHead.pistonExtension = t * t;
    if (t >= 1) {
      stampHead.phase = PHASE_PRINT;
      stampHead.phaseStart = now;
    }
  } else if (stampHead.phase === PHASE_PRINT) {
    // At full extension, drop stamp at peak compression
    stampHead.pistonExtension = 1;
    stampHead.pressureRing = 1 - t * 0.3;
    if (stampHead.pendingStamp && t > 0.2) {
      // Resolve actual stamp location:
      // - reachable: stamp at the originally-clicked point
      // - unreachable: stamp wherever the EE actually is right now
      //   (the IK solver pushes the arm as far toward the target
      //   as the kinematic chain allows, then stops)
      let stampX, stampY;
      if (stampHead.pendingStamp.reachable) {
        stampX = stampHead.pendingStamp.x;
        stampY = stampHead.pendingStamp.y;
      } else {
        const pts = forwardKinematics();
        const ee = pts[pts.length - 1];
        stampX = ee.x;
        stampY = ee.y;
      }
      commitStamp(stampX, stampY, !stampHead.pendingStamp.reachable);
      stampHead.pendingStamp = null;
    }
    if (t >= 1) {
      stampHead.phase = PHASE_RETRACT;
      stampHead.phaseStart = now;
    }
  } else if (stampHead.phase === PHASE_RETRACT) {
    // Ease-out - smooth return
    const eo = 1 - Math.pow(1 - t, 3);
    stampHead.pistonExtension = 1 - eo;
    if (t >= 1) {
      stampHead.phase = PHASE_IDLE;
      stampHead.pistonExtension = 0;
    }
  }
}

/* ============================================================
   STAMP POOL - ring buffer
   ============================================================ */
const MAX_STAMPS = 30;
const STAMP_LIFETIME = 3500; // ms
const stamps = [];

function commitStamp(x, y, wasUnreachable = false) {
  const stamp = {
    x, y,
    born: performance.now(),
    rotation: (Math.random() - 0.5) * 0.4, // slight random tilt
    id: stampCounter++,
    wasUnreachable // flag for distinct visual styling
  };
  stamps.push(stamp);
  if (stamps.length > MAX_STAMPS) stamps.shift();
}

let stampCounter = 0;

function drawStamps(now) {
  for (let i = stamps.length - 1; i >= 0; i--) {
    const s = stamps[i];
    const age = (now - s.born) / STAMP_LIFETIME;
    if (age >= 1) {
      stamps.splice(i, 1);
      continue;
    }

    // Cubic ease-out fade
    const fade = 1 - Math.pow(age, 0.5);

    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rotation);
    ctx.globalAlpha = fade;

    // Color scheme differs for unreachable stamps:
    // - reachable: orange (normal stamp at clicked location)
    // - unreachable: yellow/amber (stamp at arm's reach limit)
    const mainColor = s.wasUnreachable ? '#ffb800' : '#ff6a00';
    const accentColor = s.wasUnreachable ? '#ff3a00' : '#ffb800';
    const fillRGBA = s.wasUnreachable
      ? 'rgba(255, 184, 0, 0.15)'
      : 'rgba(255, 106, 0, 0.15)';

    // Outer hexagonal stamp boundary
    const r = 22;
    ctx.strokeStyle = mainColor;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // Inner fill - ink blot
    ctx.fillStyle = fillRGBA;
    ctx.fill();

    // Center crosshair mark
    ctx.strokeStyle = accentColor;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-6, 0); ctx.lineTo(-2, 0);
    ctx.moveTo(2, 0); ctx.lineTo(6, 0);
    ctx.moveTo(0, -6); ctx.lineTo(0, -2);
    ctx.moveTo(0, 2); ctx.lineTo(0, 6);
    ctx.stroke();

    // Center dot
    ctx.fillStyle = accentColor;
    ctx.beginPath();
    ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // ID label
    ctx.fillStyle = s.wasUnreachable
      ? 'rgba(255, 184, 0, 0.85)'
      : 'rgba(255, 106, 0, 0.8)';
    ctx.font = '8px JetBrains Mono, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`#${String(s.id).padStart(3, '0')}`, r + 4, 3);

    // Timestamp + status label
    ctx.fillStyle = 'rgba(136, 130, 120, 0.7)';
    ctx.font = '7px JetBrains Mono, monospace';
    const ms = Math.floor((now - s.born));
    ctx.fillText(`T+${String(ms).padStart(4, '0')}ms`, r + 4, 13);

    // Extra label for unreachable stamps
    if (s.wasUnreachable) {
      ctx.fillStyle = 'rgba(255, 58, 0, 0.85)';
      ctx.font = '7px JetBrains Mono, monospace';
      ctx.fillText('LIMIT', r + 4, 23);
    }

    // Subtle dashed accent ring
    ctx.strokeStyle = s.wasUnreachable
      ? 'rgba(255, 184, 0, 0.4)'
      : 'rgba(255, 106, 0, 0.35)';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([3, 3]);
    ctx.beginPath();
    ctx.arc(0, 0, r + 6, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }
}

/* ============================================================
   IK
   ============================================================ */
function forwardKinematics() {
  const base = getBase();
  const pts = [{ x: base.x, y: base.y }];
  let x = base.x, y = base.y;
  for (let i = 0; i < angles.length; i++) {
    x += Math.cos(angles[i]) * armLengths[i];
    y += Math.sin(angles[i]) * armLengths[i];
    pts.push({ x, y });
  }
  return pts;
}

// Returns the largest per-joint correction applied this call (radians),
// which is ~0 once the arm has converged on (or stretched toward) the target.
function solveIK(targetX, targetY) {
  const iterations = 8;
  let maxDelta = 0;
  for (let iter = 0; iter < iterations; iter++) {
    for (let i = angles.length - 1; i >= 0; i--) {
      const pts = forwardKinematics();
      const ee = pts[pts.length - 1];
      const joint = pts[i];

      const angToEE = Math.atan2(ee.y - joint.y, ee.x - joint.x);
      const angToTarget = Math.atan2(targetY - joint.y, targetX - joint.x);
      let delta = angToTarget - angToEE;
      while (delta > Math.PI) delta -= 2 * Math.PI;
      while (delta < -Math.PI) delta += 2 * Math.PI;
      delta *= 0.25;
      maxDelta = Math.max(maxDelta, Math.abs(delta));

      for (let j = i; j < angles.length; j++) angles[j] += delta;

      if (i === 0) {
        const minA = -Math.PI + 0.15;
        const maxA = -0.15;
        if (angles[0] < minA) {
          const diff = minA - angles[0];
          for (let j = 0; j < angles.length; j++) angles[j] += diff;
        }
        if (angles[0] > maxA) {
          const diff = maxA - angles[0];
          for (let j = 0; j < angles.length; j++) angles[j] += diff;
        }
      }
    }
  }
  return maxDelta;
}

/* ============================================================
   RENDERING - segments, joints, base
   ============================================================ */

function drawSegment(x1, y1, x2, y2, thickness, hasStripe) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.hypot(dx, dy);
  const ang = Math.atan2(dy, dx);

  ctx.save();
  ctx.translate(x1, y1);
  ctx.rotate(ang);

  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 14;
  ctx.shadowOffsetX = 4;
  ctx.shadowOffsetY = 5;

  const grad = ctx.createLinearGradient(0, -thickness / 2, 0, thickness / 2);
  grad.addColorStop(0, '#ff9540');
  grad.addColorStop(0.25, '#ff6a00');
  grad.addColorStop(0.5, '#c44300');
  grad.addColorStop(0.75, '#ff6a00');
  grad.addColorStop(1, '#6a2400');
  ctx.fillStyle = grad;
  ctx.fillRect(0, -thickness / 2, len, thickness);

  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;

  const hi = ctx.createLinearGradient(0, -thickness / 2, 0, -thickness / 2 + thickness * 0.3);
  hi.addColorStop(0, 'rgba(255, 230, 200, 0.55)');
  hi.addColorStop(1, 'rgba(255, 230, 200, 0)');
  ctx.fillStyle = hi;
  ctx.fillRect(0, -thickness / 2, len, thickness * 0.3);

  const sh = ctx.createLinearGradient(0, thickness / 2 - thickness * 0.35, 0, thickness / 2);
  sh.addColorStop(0, 'rgba(0,0,0,0)');
  sh.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = sh;
  ctx.fillRect(0, thickness / 2 - thickness * 0.35, len, thickness * 0.35);

  ctx.fillStyle = '#1a1612';
  ctx.fillRect(len * 0.12, -thickness / 2, 3, thickness);
  ctx.fillRect(len * 0.88 - 3, -thickness / 2, 3, thickness);

  if (hasStripe) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(len * 0.45, -thickness / 2, thickness * 0.55, thickness);
    ctx.clip();
    ctx.fillStyle = '#ffb800';
    ctx.fillRect(len * 0.45, -thickness / 2, thickness * 0.55, thickness);
    ctx.fillStyle = '#1a1612';
    for (let s = -thickness; s < thickness * 2; s += 7) {
      ctx.beginPath();
      ctx.moveTo(len * 0.45 + s, -thickness / 2);
      ctx.lineTo(len * 0.45 + s + 3, -thickness / 2);
      ctx.lineTo(len * 0.45 + s + 3 - thickness, thickness / 2);
      ctx.lineTo(len * 0.45 + s - thickness, thickness / 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.strokeStyle = 'rgba(20, 14, 10, 0.85)';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(0, -thickness / 2, len, thickness);

  ctx.restore();
}

function drawJoint(x, y, radius) {
  ctx.beginPath();
  ctx.arc(x, y, radius + 3, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0d0b';
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;

  const grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
  grad.addColorStop(0, '#e0dad0');
  grad.addColorStop(0.4, '#9c968e');
  grad.addColorStop(0.8, '#4a4744');
  grad.addColorStop(1, '#1f1d1a');
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x, y, radius * 0.4, 0, Math.PI * 2);
  ctx.fillStyle = '#14110f';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x, y, radius * 0.14, 0, Math.PI * 2);
  ctx.fillStyle = '#ff6a00';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x - radius * 0.35, y - radius * 0.35, radius * 0.18, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.fill();
}

function drawBase() {
  const base = getBase();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 6;

  const w = 100, h = 16;
  const grad = ctx.createLinearGradient(0, base.y - h, 0, base.y + h);
  grad.addColorStop(0, '#5a5754');
  grad.addColorStop(0.5, '#2a2826');
  grad.addColorStop(1, '#14110f');
  ctx.fillStyle = grad;
  ctx.fillRect(base.x - w / 2, base.y - 2, w, h);

  ctx.shadowColor = 'transparent';
  ctx.shadowOffsetY = 0;

  ctx.fillStyle = '#1a1612';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(base.x + i * 35, base.y + 5, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = '#555';
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath();
    ctx.arc(base.x + i * 35 - 1, base.y + 4, 1.2, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(base.x - w / 2, base.y + h - 6, w, 4);
  ctx.clip();
  for (let i = base.x - w / 2 - 10; i < base.x + w / 2 + 10; i += 10) {
    ctx.fillStyle = ((i / 10) | 0) % 2 === 0 ? '#ffb800' : '#1a1612';
    ctx.fillRect(i, base.y + h - 6, 10, 4);
  }
  ctx.restore();
  ctx.restore();
}

/* ============================================================
   STAMPING HEAD - pneumatic press
   ------------------------------------------------------------
   Anatomy (along arm axis, +x = forward):
     - Mounting flange (back, attached to wrist link)
     - Cylinder body (housing)
     - Spring coils (visible on side)
     - Piston rod (extends forward when pressing)
     - Stamp plate (the flat press surface at front)
     - Indicator LED (turns red during press)
   ============================================================ */
function drawStampHead(x, y, angle, extension) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);

  // Mounting flange (where it attaches to arm)
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 6;
  ctx.fillStyle = '#3a3734';
  ctx.fillRect(-12, -14, 6, 28);
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#0a0908';
  ctx.lineWidth = 1;
  ctx.strokeRect(-12, -14, 6, 28);

  // Cylinder body (housing)
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 10;
  const bodyGrad = ctx.createLinearGradient(0, -12, 0, 12);
  bodyGrad.addColorStop(0, '#7a7570');
  bodyGrad.addColorStop(0.4, '#3a3734');
  bodyGrad.addColorStop(0.7, '#2a2826');
  bodyGrad.addColorStop(1, '#14110f');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(-6, -12, 22, 24);
  ctx.shadowBlur = 0;

  // Cylinder body specular highlight
  const cylHi = ctx.createLinearGradient(0, -12, 0, -12 + 6);
  cylHi.addColorStop(0, 'rgba(220, 215, 205, 0.5)');
  cylHi.addColorStop(1, 'rgba(220, 215, 205, 0)');
  ctx.fillStyle = cylHi;
  ctx.fillRect(-6, -12, 22, 6);

  // Cylinder outline
  ctx.strokeStyle = '#0a0908';
  ctx.lineWidth = 1.2;
  ctx.strokeRect(-6, -12, 22, 24);

  // Pressure indicator LED (top side)
  const ledColor = stampHead.phase === PHASE_PRESS || stampHead.phase === PHASE_PRINT
    ? '#ff3a00' : '#440a00';
  ctx.fillStyle = ledColor;
  ctx.beginPath();
  ctx.arc(2, -9, 2, 0, Math.PI * 2);
  ctx.fill();
  if (stampHead.phase === PHASE_PRESS || stampHead.phase === PHASE_PRINT) {
    ctx.shadowColor = '#ff3a00';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Hex bolts on body
  ctx.fillStyle = '#1a1612';
  for (const by of [-7, 7]) {
    for (const bx of [-3, 13]) {
      ctx.beginPath();
      ctx.arc(bx, by, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Piston rod extension (forward, +x direction)
  const maxExt = 18;
  const ext = extension * maxExt;

  // Spring coils alongside the piston (visible when extended)
  if (ext > 0.5) {
    ctx.strokeStyle = '#8a8580';
    ctx.lineWidth = 1.2;
    const coils = 6;
    const springStart = 16;
    const springEnd = 16 + ext;
    for (let s = 0; s <= coils; s++) {
      const t = s / coils;
      const sx = springStart + (springEnd - springStart) * t;
      ctx.beginPath();
      ctx.arc(sx, -8, 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sx, 8, 1.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  // Piston rod (chrome shaft)
  if (ext > 0) {
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur = 6;
    const rodGrad = ctx.createLinearGradient(0, -3, 0, 3);
    rodGrad.addColorStop(0, '#f0ebe2');
    rodGrad.addColorStop(0.5, '#a8a29a');
    rodGrad.addColorStop(1, '#4a4744');
    ctx.fillStyle = rodGrad;
    ctx.fillRect(16, -3, ext, 6);
    ctx.shadowBlur = 0;

    ctx.strokeStyle = '#0a0908';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(16, -3, ext, 6);
  }

  // Stamp plate (the press surface at the end)
  const plateX = 16 + ext;
  ctx.shadowColor = 'rgba(0,0,0,0.7)';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#1a1612';
  ctx.fillRect(plateX, -9, 5, 18);
  ctx.shadowBlur = 0;

  // Plate face - the actual stamping surface
  const plateColor = stampHead.phase === PHASE_PRINT ? '#ffb800' : '#ff6a00';
  ctx.fillStyle = plateColor;
  ctx.fillRect(plateX + 3, -9, 2, 18);

  // Plate face glow during print
  if (stampHead.phase === PHASE_PRINT) {
    ctx.shadowColor = '#ffb800';
    ctx.shadowBlur = 12;
    ctx.fillRect(plateX + 3, -9, 2, 18);
    ctx.shadowBlur = 0;
  }

  // Outline plate
  ctx.strokeStyle = '#0a0908';
  ctx.lineWidth = 1;
  ctx.strokeRect(plateX, -9, 5, 18);

  ctx.restore();
}

/* ============================================================
   IMPACT EFFECTS - shockwave ring at stamp moment
   ============================================================ */
function drawImpactWave(x, y, intensity) {
  if (intensity < 0.05) return;
  ctx.save();
  ctx.translate(x, y);

  // Expanding ring
  const r = 8 + (1 - intensity) * 30;
  ctx.strokeStyle = `rgba(255, 184, 0, ${intensity * 0.7})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.stroke();

  // Inner ring
  const r2 = 4 + (1 - intensity) * 20;
  ctx.strokeStyle = `rgba(255, 106, 0, ${intensity * 0.5})`;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r2, 0, Math.PI * 2);
  ctx.stroke();

  ctx.restore();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */

const eePosEl = document.getElementById('eePos');
const gripStateEl = document.getElementById('gripState');
const stampCountEl = document.getElementById('stampCount');
const sysStateEl = document.getElementById('sysState');
const sysDotEl = document.getElementById('sysDot');

const PHASE_NAMES = {
  [PHASE_IDLE]: 'IDLE',
  [PHASE_PRESS]: 'PRESS',
  [PHASE_PRINT]: 'PRINT',
  [PHASE_RETRACT]: 'RETRACT'
};

function render(now) {
  if (!now) now = performance.now();

  updateStampHead(now);
  // Arm always tracks the pointer (mouse on desktop, last touch
  // point on mobile) - same behaviour on every platform - unless the
  // user asked for reduced motion, in which case it holds a park pose.
  let ikDelta;
  if (reduceMotion.matches) {
    const park = getParkTarget();
    ikDelta = solveIK(park.x, park.y);
  } else {
    ikDelta = solveIK(mouse.x, mouse.y);
  }
  armSettled = ikDelta < 1e-4;

  ctx.clearRect(0, 0, W, H);

  // Layer 1: stamps drawn first (under everything)
  drawStamps(now);

  // Layer 2: impact wave at most recent stamp during PRINT phase
  if (stampHead.phase === PHASE_PRINT && stampHead.pendingStamp === null && stamps.length > 0) {
    const last = stamps[stamps.length - 1];
    const elapsedSinceStamp = now - last.born;
    if (elapsedSinceStamp < 250) {
      drawImpactWave(last.x, last.y, 1 - elapsedSinceStamp / 250);
    }
  }

  // Layer 3: arm
  const pts = forwardKinematics();
  drawBase();

  const thicknesses = [34, 26, 20, 14];
  for (let i = 0; i < pts.length - 1; i++) {
    drawSegment(pts[i].x, pts[i].y, pts[i + 1].x, pts[i + 1].y, thicknesses[i], i === 0);
  }

  const jointSizes = [22, 17, 13, 10];
  for (let i = 0; i < pts.length - 1; i++) {
    drawJoint(pts[i].x, pts[i].y, jointSizes[i]);
  }

  // Layer 4: stamping head at end-effector
  const ee = pts[pts.length - 1];
  const wrist = pts[pts.length - 2];
  const eeAngle = Math.atan2(ee.y - wrist.y, ee.x - wrist.x);
  drawStampHead(ee.x, ee.y, eeAngle, stampHead.pistonExtension);

  // Layer 5: target crosshair at mouse - live reachability indicator
  // (always "reachable" under reduced motion: the arm isn't tracking,
  // and the stamp lands wherever the user clicks)
  const liveReach = reduceMotion.matches ? { reachable: true } : checkReach(mouse.x, mouse.y);
  ctx.save();
  ctx.translate(mouse.x, mouse.y);
  // Color logic:
  // - during animation: amber (active)
  // - hovering reachable point: orange
  // - hovering unreachable point: red (warning)
  const ringColor = stampHead.phase !== PHASE_IDLE ? '#ffb800'
                  : (liveReach.reachable ? '#ff6a00' : '#ff3a00');
  ctx.strokeStyle = ringColor;
  ctx.fillStyle = ringColor;
  ctx.lineWidth = 1;
  const size = 14, gap = 5;
  ctx.beginPath();
  ctx.moveTo(0, -size); ctx.lineTo(0, -gap);
  ctx.moveTo(0, gap); ctx.lineTo(0, size);
  ctx.moveTo(-size, 0); ctx.lineTo(-gap, 0);
  ctx.moveTo(gap, 0); ctx.lineTo(size, 0);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(0, 0, 2, 0, Math.PI * 2);
  ctx.fill();
  // Outer ring - dashed when out of reach for distinct feedback
  if (!liveReach.reachable && stampHead.phase === PHASE_IDLE) {
    ctx.strokeStyle = 'rgba(255, 58, 0, 0.5)';
    ctx.setLineDash([4, 3]);
  } else {
    ctx.strokeStyle = 'rgba(255, 106, 0, 0.3)';
  }
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Warning label below crosshair when out of reach
  if (!liveReach.reachable && stampHead.phase === PHASE_IDLE) {
    ctx.fillStyle = '#ff3a00';
    ctx.font = '8px JetBrains Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('OUT OF REACH', 0, 34);
  }
  ctx.restore();

  // HUD telemetry
  eePosEl.textContent = `${String(Math.round(ee.x)).padStart(3, '0')}, ${String(Math.round(ee.y)).padStart(3, '0')}`;
  gripStateEl.textContent = PHASE_NAMES[stampHead.phase];
  gripStateEl.style.color = stampHead.phase === PHASE_PRINT ? '#ff3a00'
                          : stampHead.phase === PHASE_IDLE ? '#ffb800' : '#ff9540';
  stampCountEl.textContent = String(stampCounter).padStart(3, '0');

  // Keep going only while something can still change (see Render
  // scheduling above); otherwise park the loop until the next input.
  const busy =
    stampHead.phase !== PHASE_IDLE ||
    stamps.length > 0 ||
    stampHead.pistonExtension > 0.01 ||
    stampHead.pressureRing > 0.05 ||
    !armSettled ||
    (now - lastInput) < SETTLE_MS;

  if (busy) {
    if (sysStateEl.textContent !== 'ONLINE') {
      sysStateEl.textContent = 'ONLINE';
      sysDotEl.classList.remove('standby');
    }
    requestAnimationFrame(render);
  } else {
    loopActive = false;
    sysStateEl.textContent = 'STANDBY';
    sysDotEl.classList.add('standby');
  }
}

wake();
</script>
</body>
